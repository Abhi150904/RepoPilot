[project]
name = "repopilot"
version = "0.1.0"
description = "Agentic software engineering workflow that turns issues into implementation plans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "backend",
]
testpaths = [
    "backend/tests",
]

