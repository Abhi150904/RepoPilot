[project]
name = "repopilot"
version = "0.1.0"
description = "Agentic software engineering workflow that turns issues into implementation plans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.8.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
repopilot = "app.cli:main"
repopilot-api-dev = "app.dev_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = [
    "backend",
]
testpaths = [
    "backend/tests",
]
norecursedirs = [
    "backend/tests/fixtures",
]
