name: repopilot-aws
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_DB: repopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U repopilot -d repopilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: ../.env.aws
    command: [python, -m, alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: ../.env.aws
    volumes:
      - /opt/repopilot/data:/opt/repopilot/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: ../.env.aws
    command: [repopilot, worker, run, --poll-interval, "2"]
    volumes:
      - /opt/repopilot/data:/opt/repopilot/data
      - /etc/repopilot/runner-ssh:/root/.ssh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  database:
  caddy_data:
  caddy_config:
